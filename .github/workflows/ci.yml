name: CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install jj for jj repo tests
        run: |
          tmp_dir=$(mktemp -d)
          curl -fsSL https://github.com/jj-vcs/jj/releases/download/v0.43.0/jj-v0.43.0-x86_64-unknown-linux-musl.tar.gz | tar -xz -C "$tmp_dir" jj
          sudo install "$tmp_dir/jj" /usr/local/bin/jj
          jj --version

      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run
